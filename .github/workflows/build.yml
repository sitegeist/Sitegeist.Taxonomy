name: build

on:
  push:
      branches:
        - '2.0'
        - '1.0'
  pull_request:
      branches:
        - '2.0'
        - '1.0'

jobs:
    test:
        name: "Test (PHP ${{ matrix.php-versions }}, Neos ${{ matrix.neos-versions }})"

        strategy:
            fail-fast: false
            matrix:
                php-versions: ['8.2', '8.3']
                neos-versions: ['9.0']
                include:
                  - php-versions: '8.4'
                    neos-versions: '9.1'

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v2
              with:
                  path: ${{ env.FLOW_FOLDER }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: mbstring, xml, json, zlib, iconv, intl, pdo_sqlite
                  ini-values: date.timezone="Africa/Tunis", opcache.fast_shutdown=0, apc.enable_cli=on

            - name: Set Neos Version
              run: |
                composer require neos/contentgraph-doctrinedbaladapter ^${{ matrix.neos-versions }} --no-update --no-progress --no-interaction
                composer require neos/neos ^${{ matrix.neos-versions }} --no-update --no-progress --no-interaction
                composer require neos/eventstore-doctrineadapter --no-update --no-progress --no-interaction
                composer update

            - name: Run Tests
              run: |
                composer install
                composer lint
